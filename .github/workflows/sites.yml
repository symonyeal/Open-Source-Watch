name: Sites

# Refresh regions/sites.tsv, the OSM sites engine/src/process/place.rs matches
# (scripts/osm-sites.mjs; data © OpenStreetMap contributors, ODbL 1.0). Monthly and on
# demand: sites change slowly, and the public Overpass instance asks for few queries.
# Commits to main only when the file changed.

on:
  schedule:
    - cron: '0 3 1 * *'
  # A change to the query or the workflow runs it again.
  push:
    branches: [main]
    paths: [scripts/osm-sites.mjs, .github/workflows/sites.yml]
  workflow_dispatch:

concurrency:
  group: sites
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Overpass answers kept from earlier runs of the month, so a run the server cuts
      # short resumes; a new month asks afresh.
      - id: m
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/osm
          key: osm-${{ steps.m.outputs.m }}-${{ github.run_id }}
          restore-keys: osm-${{ steps.m.outputs.m }}-

      - run: node scripts/osm-sites.mjs "$RUNNER_TEMP/osm"

      - if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/osm
          key: osm-${{ steps.m.outputs.m }}-${{ github.run_id }}

      - name: Commit and push
        run: |
          git config user.name "open-source-watch-sites"
          git config user.email "symonyeal@users.noreply.github.com"
          git add regions/sites.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Refresh regions/sites.tsv from OpenStreetMap (ODbL)"
          git push
