# South Asia: country and coastal reporting context.
# Coverage is geographic, not the World Bank's changeable region aggregate.

id = "south-asia"
name = "South Asia"
bbox = [-1.5, 38.5, 60.0, 101.5]  # lat_min, lat_max, lon_min, lon_max
languages = ["en", "bn", "hi", "ur", "si", "my", "ne", "dz"]
timezone = "Asia/Kolkata"

# Explicit scope includes Myanmar; do not derive these from a WB region code.
[context]
countries = ["BGD", "IND", "PAK", "LKA", "MMR", "NPL", "BTN", "MDV"]
# Identifiers checked against IMF PortWatch reference layer, 2026-10-24.
ports = [
  { id = "port241", name = "Chattogram" },
  { id = "port759", name = "Mongla" },
  { id = "port543", name = "Karachi" },
  { id = "port775", name = "Port Qasim" },
  { id = "port254", name = "Colombo" },
  { id = "port777", name = "Mundra" },
  { id = "port776", name = "Mumbai / Jawaharlal Nehru" },
  { id = "port1086", name = "Yangon" },
  { id = "port689", name = "Male" },
]

# F means reliability cannot yet be judged. No source-specific assessment
# supports assigning new publishers a better grade in this theater.
[reliability]
"gpsjam:gpsjam.org" = "F"
"integrity:adsb.lol" = "B"
"ioda:IODA" = "F"
"ucdp:UCDP Candidate" = "F"
"context:FRED" = "F"
"context:PortWatch" = "F"
"context:World Bank" = "F"
"rss:BBC Asia" = "F"
"rss:Al Jazeera" = "F"
"rss:gCaptain" = "F"
"rss:Splash247" = "F"
"gnews:strike" = "F"
"gnews:conflict" = "F"
"gnews:country" = "F"
# Existing global adapters are graded here too because each is shared with regions.
"firms:VIIRS" = "A"
"adsb:adsb.lol" = "B"
"ais:aisstream" = "B"
"markets:Yahoo Finance" = "B"
"markets:CoinGecko" = "B"
"markets:Polymarket" = "B"

# Descriptive reporting counts only. No local validation supports alert cutoffs.
[[pir]]
id = "SA-1"
question = "Are maritime incidents affecting South Asian ports or sea lanes being reported?"

  [[pir.indicator]]
  id = "SA-1a"
  name = "Reported maritime incidents"
  metric = "event_count"
  kind = "maritime_incident"
  window_h = 48
  max_credibility = 6

[[pir]]
id = "SA-2"
question = "Are armed clashes or attacks on civilians being reported in the region?"

  [[pir.indicator]]
  id = "SA-2a"
  name = "Reported battles"
  metric = "event_count"
  kind = "battles"
  window_h = 24
  max_credibility = 6

  [[pir.indicator]]
  id = "SA-2b"
  name = "Reported violence against civilians"
  metric = "event_count"
  kind = "violence_against_civilians"
  window_h = 24
  max_credibility = 6

[[pir]]
id = "SA-3"
question = "Are public protests or riots being reported that may disrupt daily activity?"

  [[pir.indicator]]
  id = "SA-3a"
  name = "Reported protests"
  metric = "event_count"
  kind = "protests"
  window_h = 24
  max_credibility = 6

