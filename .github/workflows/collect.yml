name: Collect

# Open-Source-Watch collection cron (design § Phases, P2). Twice a day (06:00 and
# 18:00 UTC; GitHub may start a scheduled run late) the slow feeds are polled by the
# same engine code that runs locally, and the new raw reports, observations and run
# records are committed to the orphan `data` branch.
# Fast feeds (alerts, aircraft, drone tracks) are collected only by a local engine.
# Events and entities are derived tables: `py -3.14 -m engine fuse` rebuilds them.

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Check out the data branch at ./data
        run: |
          git config --global user.name "open-source-watch-collector"
          git config --global user.email "symonyeal@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git worktree add -B data data origin/data
          else
            git worktree add --orphan -b data data
          fi

      - name: Collect slow feeds
        run: python -m engine collect --adapter rss gnews firms markets telegram context --runner cron --due

      - name: Compact past days
        run: python -m engine compact

      - name: Commit and push
        working-directory: data
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data

  # The dashboard as a static snapshot on GitHub Pages. The engine and dashboard
  # serve the stored data once, scripts/snapshot.mjs writes every route of every
  # region to JSON, and a static export reads those files. Pages keeps only the
  # latest deployment; nothing is committed.
  pages:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python -m pip install -r requirements.txt ./kernels
      - run: npm ci

      - name: Fuse the stored data and serve it
        run: |
          git fetch --depth 1 origin data
          git worktree add --detach data origin/data
          python -m engine fuse
          python -c "from engine import cycle; cycle.analyse(('intsum', 'sitrep'))"
          python -m engine serve --no-collect > engine.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:8790/regions > /dev/null; do sleep 1; done'

      - name: Snapshot every route
        env:
          ENGINE_URL: http://127.0.0.1:8790
        run: |
          npm run build
          npx next start -p 3000 > next.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:3000/ > /dev/null; do sleep 1; done'
          node scripts/snapshot.mjs http://127.0.0.1:3000 public

      - name: Static export
        run: |
          rm -rf src/app/api .next
          NEXT_PUBLIC_SNAPSHOT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }} npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
