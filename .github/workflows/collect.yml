name: Collect

# Open-Source-Watch collection cron (design § Phases, P2). Twice a day (06:00 and
# 18:00 UTC; GitHub may start a scheduled run late) the slow feeds are polled by the
# same engine code that runs locally, and the new raw reports, observations and run
# records are committed to the orphan `data` branch.
# Fast feeds (alerts, aircraft, drone tracks, aircraft integrity) are collected only by a
# local engine.
# Events and entities are derived tables: `osw fuse` rebuilds them.

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Check out the data branch at ./data
        run: |
          git config --global user.name "open-source-watch-collector"
          git config --global user.email "symonyeal@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git worktree add -B data data origin/data
          else
            git worktree add --orphan -b data data
          fi

      - name: Collect slow feeds
        run: engine/target/release/osw collect --adapter rss gnews firms markets telegram context gpsjam mnd ioda ucdp --runner cron --due

      - name: Compact past days
        run: engine/target/release/osw compact

      - name: Commit and push
        working-directory: data
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data
