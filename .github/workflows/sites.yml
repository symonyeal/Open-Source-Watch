name: Sites

# Refresh regions/sites.tsv, the OSM sites engine/src/process/place.rs matches
# (scripts/osm-sites.mjs; data © OpenStreetMap contributors, ODbL 1.0). Monthly and on
# demand: sites change slowly, and the public Overpass instance asks for few queries.
# Commits to main only when the file changed.

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

concurrency:
  group: sites
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/osm-sites.mjs "$RUNNER_TEMP/osm"

      - name: Commit and push
        run: |
          git config user.name "open-source-watch-sites"
          git config user.email "symonyeal@users.noreply.github.com"
          git add regions/sites.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Refresh regions/sites.tsv from OpenStreetMap (ODbL)"
          git push
