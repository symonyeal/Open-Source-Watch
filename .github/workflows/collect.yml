name: Collect

# Open-Source-Watch collection cron (design § Phases, P2). Twice a day (06:17 and
# 18:17 UTC, off the hour: GitHub delays or drops scheduled runs at the start of each
# hour under load, and started these up to 9 h late) the slow feeds are polled by the
# same engine code that runs locally, and the new raw reports, observations and run
# records are committed to the orphan `data` branch.
# Fast feeds (alerts, aircraft, drone tracks, aircraft integrity) are collected only by a
# local engine.
# Events and entities are derived tables: `osw fuse` rebuilds them.

on:
  schedule:
    - cron: '17 6,18 * * *'
    # Weekly: also translate the reports the translation endpoint refused (osw
    # retranslate rewrites the observation table, 16 MB, so not every run).
    - cron: '43 3 * * 1'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Check out the data branch at ./data
        run: |
          git config --global user.name "open-source-watch-collector"
          git config --global user.email "symonyeal@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git worktree add -B data data origin/data
          else
            git worktree add --orphan -b data data
          fi

      - name: Collect slow feeds
        run: engine/target/release/osw collect --adapter rss gnews firms telegram context gpsjam mnd ioda ucdp --runner cron --due

      - name: Translate refused reports (weekly)
        if: github.event.schedule == '43 3 * * 1' || github.event_name == 'workflow_dispatch'
        run: engine/target/release/osw retranslate

      - name: Compact past days
        run: engine/target/release/osw compact

      - name: Commit and push
        working-directory: data
        run: |
          git add -A -- . ':!.writer.lock'
          git diff --cached --quiet && exit 0
          git commit -q -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin data && exit 0; git pull -q --rebase origin data; done
          exit 1
