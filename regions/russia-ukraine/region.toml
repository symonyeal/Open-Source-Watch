[[pir]]
id = "RU-1"
question = "Is a large Russian missile or drone strike on Ukraine under way?"

  [[pir.indicator]]
  id = "RU-1a"
  name = "Oblast air-raid alerts"
  kind = "air_raid_alert"
  window_h = 3
  watch = 3
  trigger = 12
  max_credibility = 3

  [[pir.indicator]]
  id = "RU-1b"
  name = "Tracked drones and missiles"
  kind = "airspace_activity"
  window_h = 3
  watch = 5
  trigger = 30
  max_credibility = 4

[[pir]]
id = "RU-2"
question = "Are strikes hitting energy or industrial sites?"

  [[pir.indicator]]
  id = "RU-2a"
  name = "Reported strikes or explosions"
  kind = "explosions_remote_violence"
  window_h = 12
  watch = 3
  trigger = 10
  max_credibility = 3

  [[pir.indicator]]
  id = "RU-2b"
  name = "High-confidence thermal anomalies"
  kind = "thermal_anomaly"
  window_h = 12
  watch = 10
  trigger = 40
  max_credibility = 3

[[pir]]
id = "RU-3"
question = "Is there naval or maritime activity in the Black Sea?"

  [[pir.indicator]]
  id = "RU-3a"
  name = "Maritime incidents"
  kind = "maritime_incident"
  window_h = 24
  watch = 1
  trigger = 3
  max_credibility = 3

# Countries whose internet connectivity IODA measures for this region (ISO 3166-1
# alpha-2). An outage is placed at the seat of government (engine.process.feeds.ioda).
[outages]
countries = [
  { code = "UA", name = "Ukraine", lat = 50.4501, lon = 30.5234 },
  { code = "RU", name = "Russia", lat = 55.7558, lon = 37.6173 },
]

# Descriptive: gpsjam.org cell bands and IODA detections, no alert threshold.
[[pir]]
id = "RU-4"
question = "Is satellite navigation or internet connectivity in the region degraded?"

  [[pir.indicator]]
  id = "RU-4a"
  name = "GNSS cells with over 10 % of aircraft reporting low accuracy (gpsjam.org, latest day)"
  metric = "gnss"
  band = "high"

  [[pir.indicator]]
  id = "RU-4b"
  name = "Internet outages detected (IODA)"
  metric = "event_count"
  kind = "internet_outage"
  window_h = 48
  max_credibility = 6
