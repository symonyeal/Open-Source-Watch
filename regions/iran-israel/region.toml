# Engine-owned configuration for the Iran / Israel theater.
# Feeds, channels and keywords come from conflict.json, exported from
# src/lib/conflicts/iran-israel.ts (spec § Seam). This file holds what the
# engine alone decides: geography, grades, ownership, PIRs, indicators.

id = "iran-israel"
name = "Iran / Israel"
bbox = [20.0, 42.0, 25.0, 65.0]  # lat_min, lat_max, lon_min, lon_max
languages = ["en", "he", "ar", "fa"]

