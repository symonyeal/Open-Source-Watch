# Owner, where it differs from the source name; sources sharing an owner are
# not independent (spec § Credibility).
[owner]
"telegram:PressTV" = "PressTV"
"telegram:TimesofIsrael" = "Times of Israel"
"telegram:dropsitenews" = "Drop Site"
"telegram:aljazeeraglobal" = "Al Jazeera"
"telegram:middle_east_spectator" = "Middle East Spectator"
"telegram:Middle_East_Spectator" = "Middle East Spectator"
"telegram:sepah" = "IRGC"
"telegram:SaberinFa" = "IRGC"

# Priority intelligence requirements and their indicators (spec § Data model).
# An indicator counts events of `kind` with credibility <= max_credibility in
# the last window_h hours: >= watch -> watch, >= trigger -> triggered.

[[pir]]
id = "II-1"
question = "Is a direct missile or drone exchange between Iran and Israel under way?"

  [[pir.indicator]]
  id = "II-1a"
  name = "Air-raid alerts in Israel"
  kind = "air_raid_alert"
  window_h = 6
  watch = 1
  trigger = 10
  max_credibility = 3

  [[pir.indicator]]
  id = "II-1b"
  name = "Reported strikes or explosions"
  kind = "explosions_remote_violence"
  window_h = 6
  watch = 2
  trigger = 6
  max_credibility = 3

[[pir]]
id = "II-2"
question = "Is maritime traffic through Hormuz or the Red Sea under attack?"

  [[pir.indicator]]
  id = "II-2a"
  name = "Maritime incidents"
  kind = "maritime_incident"
  window_h = 24
  watch = 1
  trigger = 3
  max_credibility = 3

[[pir]]
id = "II-3"
question = "Are there unusual thermal detections consistent with strikes?"

  [[pir.indicator]]
  id = "II-3a"
  name = "High-confidence thermal anomalies"
  kind = "thermal_anomaly"
  window_h = 12
  watch = 5
  trigger = 25
  max_credibility = 3

# Countries whose internet connectivity IODA measures for this region (ISO 3166-1
# alpha-2). An outage is placed at the seat of government (engine.process.feeds.ioda).
[outages]
countries = [
  { code = "IR", name = "Iran", lat = 35.6892, lon = 51.389 },
  { code = "IL", name = "Israel", lat = 31.7683, lon = 35.2137 },
  { code = "LB", name = "Lebanon", lat = 33.8938, lon = 35.5018 },
  { code = "SY", name = "Syria", lat = 33.5138, lon = 36.2765 },
  { code = "IQ", name = "Iraq", lat = 33.3152, lon = 44.3661 },
  { code = "JO", name = "Jordan", lat = 31.9539, lon = 35.9106 },
  { code = "YE", name = "Yemen", lat = 15.3694, lon = 44.191 },
]

# Descriptive: gpsjam.org cell bands and IODA detections, no alert threshold.
[[pir]]
id = "II-4"
question = "Is satellite navigation or internet connectivity in the region degraded?"

  [[pir.indicator]]
  id = "II-4a"
  name = "GNSS cells with over 10 % of aircraft reporting low accuracy (gpsjam.org, latest day)"
  metric = "gnss"
  band = "high"

  [[pir.indicator]]
  id = "II-4b"
  name = "Internet outages detected (IODA)"
  metric = "event_count"
  kind = "internet_outage"
  window_h = 48
  max_credibility = 6
